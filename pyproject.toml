# 로컬 회귀 테스트를 위한 구성입니다. 미들웨어 코드는 기존 애플리케이션에
# 복사해서 사용하므로 운영 환경에서 이 프로젝트를 별도 패키지로 만들거나
# 설치할 필요가 없습니다.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents-loop-guard"
version = "0.1.0"
description = "Regression-test scaffold for a drop-in Deep Agents tool-call middleware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7,<1",
    "langchain>=1.3.14,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_loop_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
